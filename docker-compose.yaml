services:
  api:
    image: python:3.11-slim
    container_name: pr-reviewer-api
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
