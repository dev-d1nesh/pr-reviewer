<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ PR Reviewer | AI-Powered Safety</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --accent: #f472b6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.15) 0, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.1);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .history-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            padding: 0.75rem;
            border-radius: 0.75rem;
            background: var(--glass);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border);
        }

        .history-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--primary);
        }

        .history-item-icon {
            color: var(--text-dim);
        }

        .history-item-info {
            flex: 1;
            overflow: hidden;
        }

        .history-item-name {
            font-size: 0.875rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-date {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .content-area {
            position: relative;
            min-height: 600px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-dim);
        }

        .welcome-screen i {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: var(--primary);
            opacity: 0.2;
        }

        .review-content {
            padding: 1rem;
            line-height: 1.6;
        }

        .review-content h1,
        .review-content h2,
        .review-content h3 {
            margin: 1.5rem 0 1rem;
            color: var(--primary);
        }

        .review-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .review-content th,
        .review-content td {
            padding: 0.75rem;
            text-align: left;
            border: 1px solid var(--border);
        }

        .review-content th {
            background: var(--glass);
            color: var(--primary);
        }

        .review-content pre {
            background: #1e1e1e;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid var(--border);
        }

        .review-content code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
        }

        .loader {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            z-index: 10;
            border-radius: 1.5rem;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-critical {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .status-accidental {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <i data-lucide="shield-check"></i>
            PR REVIEWER
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="card">
                <h3>New Review</h3>
                <p style="color: var(--text-dim); font-size: 0.875rem; margin-bottom: 1.5rem;">Configure your automated
                    audit</p>

                <div class="form-group">
                    <label>GitHub PR URL</label>
                    <input type="text" id="pr-url" placeholder="https://github.com/owner/repo/pull/123" value="">
                </div>

                <div class="form-group">
                    <label>AI Provider</label>
                    <select id="provider">
                        <option value="openai">OpenAI (GPT-4o)</option>
                        <option value="gemini">Google Gemini (2.5 Flash)</option>
                    </select>
                </div>

                <button id="run-review">
                    <i data-lucide="play"></i>
                    Run Audit
                </button>
            </div>

            <div class="card" style="flex: 1;">
                <h3>Audit History</h3>
                <div class="history-list" id="history-list">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </div>

        <div class="content-area card">
            <div id="loader" class="loader">
                <div class="spinner"></div>
                <p>Analyzing Pull Request...</p>
                <p style="font-size: 0.75rem; color: var(--text-dim);">This may take 30-60 seconds depending on diff
                    size.</p>
            </div>

            <div id="welcome-screen" class="welcome-screen">
                <i data-lucide="search-code"></i>
                <h2>No Audit Selected</h2>
                <p>Paste a PR URL or select an item from history to view results.</p>
            </div>

            <div id="review-display" class="review-content" style="display: none;">
                <!-- Markdown review results will be injected here -->
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        const prUrlInput = document.getElementById('pr-url');
        const providerSelect = document.getElementById('provider');
        const runBtn = document.getElementById('run-review');
        const historyList = document.getElementById('history-list');
        const loader = document.getElementById('loader');
        const welcomeScreen = document.getElementById('welcome-screen');
        const reviewDisplay = document.getElementById('review-display');

        async function fetchHistory() {
            try {
                const response = await fetch('/api/reviews');
                const data = await response.json();
                renderHistory(data);
            } catch (err) {
                console.error('Failed to fetch history:', err);
            }
        }

        function renderHistory(items) {
            historyList.innerHTML = items.length ? '' : '<p style="color: var(--text-dim); text-align: center; margin-top: 1rem;">No history yet</p>';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.onclick = () => loadReview(item.id);

                const date = new Date(item.created_at * 1000).toLocaleString();

                div.innerHTML = `
                    <i data-lucide="file-text" class="history-item-icon"></i>
                    <div class="history-item-info">
                        <div class="history-item-name">${item.id}</div>
                        <div class="history-item-date">${date}</div>
                    </div>
                `;
                historyList.appendChild(div);
            });
            lucide.createIcons();
        }

        async function loadReview(id) {
            try {
                loader.style.display = 'flex';
                const response = await fetch(`/api/reviews/${id}`);
                const data = await response.json();

                welcomeScreen.style.display = 'none';
                reviewDisplay.style.display = 'block';
                reviewDisplay.innerHTML = marked.parse(data.content);

                // Highlight history item
                document.querySelectorAll('.history-item').forEach(el => {
                    el.classList.toggle('active', el.innerText.includes(id));
                });

            } catch (err) {
                alert('Failed to load review content');
            } finally {
                loader.style.display = 'none';
            }
        }

        runBtn.onclick = async () => {
            const pr_url = prUrlInput.value.trim();
            if (!pr_url) return alert('Please enter a GitHub PR URL');

            runBtn.disabled = true;
            loader.style.display = 'flex';
            welcomeScreen.style.display = 'none';
            reviewDisplay.style.display = 'none';

            try {
                const response = await fetch('/api/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pr_url,
                        provider: providerSelect.value
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Audit failed');
                }

                const result = await response.json();

                if (result.content) {
                    reviewDisplay.style.display = 'block';
                    reviewDisplay.innerHTML = marked.parse(result.content);
                    fetchHistory();
                } else {
                    alert(result.message);
                    welcomeScreen.style.display = 'flex';
                }

            } catch (err) {
                alert('Error: ' + err.message);
                welcomeScreen.style.display = 'flex';
            } finally {
                runBtn.disabled = false;
                loader.style.display = 'none';
            }
        };

        // Initial fetch
        fetchHistory();
    </script>
</body>

</html>
